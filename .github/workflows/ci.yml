name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Reject competing lockfiles
        run: |
          for lockfile in package-lock.json yarn.lock bun.lock bun.lockb; do
            if [ -e "$lockfile" ]; then
              echo "::error file=$lockfile::pnpm is the only package manager for this repository. Remove $lockfile."
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all quality gates
        run: pnpm check

  providers:
    name: Provider integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      object-store:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: holqatest
          RUSTFS_SECRET_KEY: holqa-test-secret
          # Publishes bucket notifications to the RabbitMQ service (by its service name), for storage event tests.
          RUSTFS_NOTIFY_ENABLE: "true"
          RUSTFS_NOTIFY_AMQP_ENABLE_PRIMARY: on
          RUSTFS_NOTIFY_AMQP_URL_PRIMARY: amqp://guest:guest@rabbitmq:5672
          RUSTFS_NOTIFY_AMQP_EXCHANGE_PRIMARY: holqa.storage-events
          RUSTFS_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: storage
          RUSTFS_NOTIFY_AMQP_PERSISTENT_PRIMARY: on
    env:
      HOLQA_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      HOLQA_S3_ENDPOINT: http://localhost:9000
      HOLQA_S3_ACCESS_KEY_ID: holqatest
      HOLQA_S3_SECRET_ACCESS_KEY: holqa-test-secret
      HOLQA_S3_EVENTS_TARGET: arn:rustfs:sqs::primary:amqp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run provider tests against real infrastructure
        run: pnpm turbo run test --filter=@holqa/rabbitmq --filter=@holqa/s3 --filter=@holqa/example-document-processing
