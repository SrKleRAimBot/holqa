name: Feature or design proposal
description: Propose a capability, API, or architectural change.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you have in mind. Illustrative code is welcome.
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Portability and compatibility
      description: How would this work across infrastructure providers and the local runtime? Does it affect existing contracts?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
