minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-path-alias@2 declares `eslint@^8` but only uses APIs that
    # still exist in ESLint 10 (`context.filename` fallback). Verified by `pnpm lint`.
    eslint-plugin-path-alias>eslint: "10"

shellEmulator: true

packages:
  - packages/*
  - packages/integrations/*
  - packages/providers/*
  - examples/*
  # Disposable M0 architecture experiments. See experiments/README.md.
  - experiments/*

# Shared dependency versions. Reference them from package manifests with `catalog:`.
catalog:
  "@antfu/eslint-config": ^9.5.1
  "@changesets/cli": ^3.0.3
  "@types/bun": ^1.3.13
  "@valibot/to-json-schema": ^1.8.0
  eslint: ^10.12.0
  eslint-plugin-format: ^2.0.1
  eslint-plugin-n: ^18.4.1
  eslint-plugin-path-alias: ^2.1.0
  rabbitmq-client: 5.0.8
  tsdown: ^0.23.1
  turbo: ^2.11.8
  typescript: ~6.0.3
  valibot: ^1.5.0
  zod: ^4.6.7
